name: Build VYBE Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK environment
        run: |
          # On ubuntu-latest, the Android SDK is pre-installed at $ANDROID_HOME / $ANDROID_SDK_ROOT
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

          # Locate sdkmanager in cmdline-tools
          SDKMANAGER_DIR=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_DIR="$SDK_ROOT/cmdline-tools/latest/bin"
          elif [ -x "$SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER_DIR="$SDK_ROOT/cmdline-tools/bin"
          else
            # Search any versioned cmdline-tools directory
            FOUND=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -type f -executable 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              SDKMANAGER_DIR="$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$SDKMANAGER_DIR" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi

          echo "SDKMANAGER_DIR=$SDKMANAGER_DIR" >> $GITHUB_ENV
          echo "$SDKMANAGER_DIR" >> $GITHUB_PATH

          echo "Using sdkmanager at: $SDKMANAGER_DIR/sdkmanager"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build VYBE debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon

      - name: Verify APK exists
        run: |
          set -e
          APK="TMessagesProj_App/build/outputs/apk/afat/debug/app.apk"
          test -f "$APK"
          test -s "$APK"
          echo "APK verified: $APK ($(stat -c%s "$APK") bytes)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vybe-debug-apk
          path: TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error